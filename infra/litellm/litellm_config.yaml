# Quimera/OpenClaw LiteLLM local gateway config.
#
# This operational config is local-only. It intentionally does not define
# OpenAI, Anthropic, Gemini, or any remote provider.
#
# LiteLLM supports os.environ/VAR_NAME for whole config values. Because model
# names need an "ollama_chat/" prefix, start_litellm.sh derives:
# - LITELLM_LOCAL_CHAT_MODEL=ollama_chat/${QWEN_MODEL}  (chat endpoint; thinking disabled per alias)
# - LITELLM_LOCAL_EMBED_MODEL=ollama/${EMBED_MODEL}     (generate endpoint; correct for embeddings)

model_list:
  - model_name: local_chat
    litellm_params:
      model: os.environ/LITELLM_LOCAL_CHAT_MODEL
      api_base: os.environ/OLLAMA_BASE_URL
      timeout: 120
      stream_timeout: 45
      max_retries: 1
      keep_alive: -1
      temperature: 0.2
      extra_body:
        think: false
    model_info:
      provider: ollama
      purpose: default local chat
      thinking_mode: false

  - model_name: local_think
    litellm_params:
      model: os.environ/LITELLM_LOCAL_CHAT_MODEL
      api_base: os.environ/OLLAMA_BASE_URL
      timeout: 120
      stream_timeout: 45
      max_retries: 1
      keep_alive: -1
      temperature: 0.2
    model_info:
      provider: ollama
      purpose: local reasoning calls
      thinking_mode: true

  - model_name: local_rag
    litellm_params:
      model: os.environ/LITELLM_LOCAL_CHAT_MODEL
      api_base: os.environ/OLLAMA_BASE_URL
      timeout: 120
      stream_timeout: 45
      max_retries: 1
      keep_alive: -1
      temperature: 0.1
      extra_body:
        think: false
    model_info:
      provider: ollama
      purpose: RAG answer synthesis from Qdrant context
      thinking_mode: false

  - model_name: local_json
    litellm_params:
      model: os.environ/LITELLM_LOCAL_CHAT_MODEL
      api_base: os.environ/OLLAMA_BASE_URL
      timeout: 60
      stream_timeout: 45
      max_retries: 1
      keep_alive: -1
      temperature: 0.0
      extra_body:
        think: false
    model_info:
      provider: ollama
      purpose: structured local JSON responses
      response_contract: json
      thinking_mode: false

  - model_name: qwen3-local
    litellm_params:
      model: os.environ/LITELLM_LOCAL_CHAT_MODEL
      api_base: os.environ/OLLAMA_BASE_URL
      timeout: 120
      stream_timeout: 45
      max_retries: 1
      keep_alive: -1
      temperature: 0.2
      extra_body:
        think: false
    model_info:
      provider: ollama
      purpose: canonical Qwen3 local chat alias
      mode: chat
      owned_by: quimera-local
      thinking_mode: false

  - model_name: qwen3:14b
    litellm_params:
      model: os.environ/LITELLM_LOCAL_CHAT_MODEL
      api_base: os.environ/OLLAMA_BASE_URL
      timeout: 120
      stream_timeout: 45
      max_retries: 1
      keep_alive: -1
      temperature: 0.2
      extra_body:
        think: false
    model_info:
      provider: ollama
      purpose: compatibility alias for canonical Qwen3 model name
      mode: chat
      owned_by: quimera-local
      alias_of: qwen3-local
      thinking_mode: false

  - model_name: nomic-embed-text
    litellm_params:
      model: os.environ/LITELLM_LOCAL_EMBED_MODEL
      api_base: os.environ/OLLAMA_BASE_URL
      timeout: 5
      stream_timeout: 5
      max_retries: 1
      keep_alive: -1
    model_info:
      provider: ollama
      purpose: canonical local embedding model alias
      mode: embedding
      owned_by: quimera-local
      output_dimensions: 768

  - model_name: quimera_embed
    litellm_params:
      model: os.environ/LITELLM_LOCAL_EMBED_MODEL
      api_base: os.environ/OLLAMA_BASE_URL
      timeout: 5
      stream_timeout: 5
      max_retries: 1
      keep_alive: -1
    model_info:
      provider: ollama
      purpose: canonical Quimera embedding alias for Qdrant RAG
      embedding_contract: openai_compatible_v1_embeddings
      compatibility_alias: local_embed
      output_dimensions: 768

  - model_name: local_embed
    litellm_params:
      model: os.environ/LITELLM_LOCAL_EMBED_MODEL
      api_base: os.environ/OLLAMA_BASE_URL
      timeout: 5
      stream_timeout: 5
      max_retries: 1
      keep_alive: -1
    model_info:
      provider: ollama
      purpose: compatibility alias for local embeddings
      embedding_contract: openai_compatible_v1_embeddings
      canonical_alias: quimera_embed
      output_dimensions: 768

litellm_settings:
  callbacks:
    - otel
  cache: true
  cache_params:
    type: qdrant-semantic
    qdrant_api_base: os.environ/QDRANT_API_BASE
    qdrant_collection_name: quimera_llm_cache
    # EXPERIMENTAL: qdrant-semantic can fall back to local via render_config.py.
    # Tracked upstream: BerriAI issue 23441.
    qdrant_semantic_cache_embedding_model: nomic-embed-text
    qdrant_semantic_cache_vector_size: 768
    similarity_threshold: 0.92
  drop_params: true
  set_verbose: false
  json_logs: true
  turn_off_message_logging: true
  redact_user_api_key_info: true
  num_retries: 1
  request_timeout: 165

callback_settings:
  otel:
    message_logging: false

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  disable_spend_logs: true
