name: quimera-local

services:
  postgres-memory:
    container_name: quimera-postgres-memory
    image: postgres:18.4-trixie
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
      - ../postgres/initdb:/docker-entrypoint-initdb.d:ro
      - ../postgres/secrets/postgres_password.txt:/run/secrets/quimera_postgres_password:ro
    environment:
      - POSTGRES_DB=quimera
      - POSTGRES_USER=quimera
      - POSTGRES_PASSWORD_FILE=/run/secrets/quimera_postgres_password
      - PGDATA=/var/lib/postgresql/18/docker
    restart: unless-stopped
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U quimera -d quimera -h 127.0.0.1
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  qdrant:
    container_name: quimera-qdrant
    image: qdrant/qdrant:v1.18.2
    ports:
      - "127.0.0.1:6333:6333"
      - "127.0.0.1:6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
      - ../qdrant/config.yaml:/qdrant/config/production.yaml:ro
    environment:
      - QDRANT__SERVICE__HTTP_PORT=6333
      - QDRANT__SERVICE__GRPC_PORT=6334
    restart: unless-stopped
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          bash -lc 'exec 3<>/dev/tcp/127.0.0.1/6333 &&
          printf "GET /healthz HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n" >&3 &&
          grep -q "200" <&3'
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

volumes:
  postgres_data:
  qdrant_data:
