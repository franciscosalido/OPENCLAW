# Qdrant local config for Quimera Q18.
# Q18-02 scope: server/client upgrade and readiness only.
# Do not configure collection schema, strict mode, quantization or low-memory mode here.

service:
  host: 0.0.0.0
  http_port: 6333
  grpc_port: 6334
  max_request_size_mb: 32
  max_workers: 0

log_level: INFO

# Reserved for Q18-04/Q18-05.
# strict_mode_config is not enabled in Q18-02.
# strict_mode_config:
#   enabled: false
#   max_query_limit: 10000
#   max_timeout: 60
#   max_resident_memory_percent: 0

# Reserved for Q18-05.
# low_memory_mode is not enabled in Q18-02.
