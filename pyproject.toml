[project]
name = "openclaw"
version = "0.1.0"
description = "OPENCLAW — Local-first AI financial intelligence"
requires-python = ">=3.12"

dependencies = [
    # RAG-0 core
    "httpx>=0.28.0",
    "qdrant-client>=1.18",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.7.0",
    "pyyaml>=6.0.2",
    "loguru>=0.7.3",
    "asyncpg>=0.30.0",
    "opentelemetry-api>=1.42.1",
    "opentelemetry-sdk>=1.42.1",
    "opentelemetry-exporter-otlp-proto-http>=1.42.1",
    "opentelemetry-instrumentation-asyncpg>=0.63b1",
    "fastmcp>=3.4.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.25.0",
    "mypy>=1.13.0",
    "pyright>=1.1.390",
    "types-pyyaml>=6.0.12",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "smoke: end-to-end tests requiring Ollama + Qdrant",
    "integration: tests requiring local services such as Qdrant or PostgreSQL",
]

[tool.mypy]
python_version = "3.12"
strict = true
exclude = [
    "^\\.mutmut-cache/",
    "^mutants/",
]
ignore_missing_imports = false
warn_return_any = true
warn_unused_configs = true

[tool.pyright]
pythonVersion = "3.12"
typeCheckingMode = "basic"
exclude = [
    ".mutmut-cache",
    "mutants",
]
venvPath = "."
venv = ".venv"

[tool.vulture]
paths = ["backend"]
min_confidence = 80
ignore_names = [
    "normalize_embeddings",
    "sentences",
    "show_progress_bar",
    "sparse_vectors_config",
    "vectors_config",
    "with_payload",
]

[tool.mutmut]
source_paths = ["backend"]
also_copy = [
    "config",
    "infra",
    "integration",
    "scripts",
    "tests",
    "pyproject.toml",
]
mutate_only_covered_lines = false
pytest_add_cli_args = ["-p", "no:randomly", "--tb=no", "-q"]
pytest_add_cli_args_test_selection = [
    "tests/unit",
    "tests/integration",
    "tests/e2e",
    "tests/smoke",
]
