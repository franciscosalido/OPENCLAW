for file in \
  "AGENTS.md" \
  "docs/04_MEM/AGENT_CONTEXT.md" \
  "docs/04_MEM/current_state.md" \
  "docs/04_MEM/decisions.md" \
  "pyproject.toml" \
  "uv.lock" \
  "docker/docker-compose.qdrant.yml"
do
  test -f "$file" || {
    echo "ERROR: missing required file: $file"
    exit 1
  }
done

echo "-- required tools --"
for tool in git uv python3; do
  command -v "$tool" >/dev/null || {
    echo "ERROR: missing required tool: $tool"
    exit 1
  }
done

if ! command -v docker >/dev/null; then
  echo "WARN: docker not found in PATH"
fi

echo "-- versions --"
git --version
uv --version
python3 --version
docker --version 2>/dev/null || true

echo "-- uv lock contract --"
uv lock --check

echo "-- qdrant contract --"
grep -q 'qdrant-client>=1.18,<1.19' pyproject.toml
grep -q 'version = "1.18.0"' uv.lock
grep -q 'qdrant/qdrant:v1.18.2' docker/docker-compose.qdrant.yml

echo "-- forbidden active legacy pins --"
if grep -n 'qdrant-client==1.13.2' pyproject.toml uv.lock; then
  echo "ERROR: active legacy qdrant-client pin found"
  exit 1
fi

echo "-- shell note --"
echo "Codex setup script is running under: ${SHELL:-unknown}"
echo "Script interpreter: bash"

