[setup.darwin]
script = '''
#!/usr/bin/env bash
set -Eeuo pipefail

echo "== QUIMERA macOS setup check =="

PROJECT_ROOT="/Users/fas/projetos/OPENCLAW"
cd "$PROJECT_ROOT"

echo "-- macOS --"
sw_vers || true
uname -a || true

echo "-- git --"
git status --short --branch

if git ls-files -u | grep -q .; then
  echo "ERROR: unresolved git conflicts found"
  git ls-files -u
  exit 1
