[setup]
script = '''
#!/usr/bin/env bash
set -Eeuo pipefail

echo "== QUIMERA environment check =="

cd /Users/fas/projetos/OPENCLAW

echo "-- git --"
git status --short --branch
git ls-files -u | grep . && {
  echo "ERROR: unresolved git conflicts found"
  exit 1
} || true

echo "-- required files --"
test -f AGENTS.md
test -f docs/04_MEM/AGENT_CONTEXT.md
test -f docs/04_MEM/current_state.md
test -f pyproject.toml
test -f uv.lock
test -f docker/docker-compose.qdrant.yml

echo "-- tools --"
command -v uv >/dev/null
command -v git >/dev/null
command -v docker >/dev/null || echo "WARN: docker not found in PATH"

echo "-- python --"
python3 --version || true

echo "-- uv lock contract --"
uv lock --check

echo "-- qdrant contract --"
grep -q 'qdrant-client>=1.18,<1.19' pyproject.toml
grep -q 'version = "1.18.0"' uv.lock
grep -q 'qdrant/qdrant:v1.18.2' docker/docker-compose.qdrant.yml

echo "-- no active legacy qdrant client pin --"
! grep -R 'qdrant-client==1.13.2' pyproject.toml uv.lock

echo "OK: QUIMERA environment contract looks consistent."
