    display_name: "IPCA"
    provider: bcb_sgs
    provider_code: "433"
    provider_code_status: planning_reference
    requires_live_verification: true
    source_id: bcb_sgs
    original_source: ibge
    unit: percent
    periodicity: monthly
    value_type: rate_percent
    methodology_note: "Candidate SGS code for IPCA; verify against the live BCB/SGS catalog/API before operational ingestion."
