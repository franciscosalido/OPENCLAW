schema_version: 1
source_policy:
  provider_codes_are_ground_truth: false
  requires_live_verification_before_ingestion: true
  provider_api_pattern: "https://api.bcb.gov.br/dados/serie/bcdata.sgs.{codigo_serie}/dados?formato=json&dataInicial={dataInicial}&dataFinal={dataFinal}"
  notes:
    - "SGS provider codes are planning references until verified against the live BCB/SGS catalog/API."
    - "Daily SGS JSON/CSV queries can require explicit date filters; ingestion must use bounded windows."
lineage_hash_contract:
  algorithm: sha256
  canonical_fields:
    - series_code
    - ref_ts
    - value
    - source_id
    - provider_code
    - schema_version
series:
