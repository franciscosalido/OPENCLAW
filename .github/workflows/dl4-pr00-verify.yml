name: DL4-PR00 diagnostic evidence
on:
  pull_request:
    branches: [codex/dl4-pr00-pydantic-floor]
permissions:
  actions: read
  contents: read
jobs:
  evidence:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: 45619867730
          name: dl4-pr00-ubuntu-24.04
          path: ${{ runner.temp }}/previous
      - name: Inspect first Linux failures
        run: |
          cd "$RUNNER_TEMP/previous"
          grep -E '^E +|^FAILED |^SUBFAILED' integration.log unit.log | tail -100
