name: DL4-PR00 evidence handoff
on:
  pull_request:
    branches: [codex/dl4-pr00-pydantic-floor]
permissions:
  actions: read
  contents: read
jobs:
  evidence:
    strategy:
      matrix:
        include:
          - {run: 45620198025, artifact: dl4-pr00-macos-15, label: mac-arm64}
          - {run: 45621663664, artifact: dl4-pr00-ubuntu-24.04, label: linux-x86_64}
          - {run: 45622511335, artifact: dl4-base-integration, label: base-integration}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: ${{ matrix.run }}
          name: ${{ matrix.artifact }}
          path: ${{ runner.temp }}/evidence
      - name: Verify and export the stored reports
        run: |
          cd "$RUNNER_TEMP/evidence"
          tar czf "$RUNNER_TEMP/reports.tgz" .
          sha256sum "$RUNNER_TEMP/reports.tgz"
          base64 -w 512 "$RUNNER_TEMP/reports.tgz" | sed 's/^/DL4REPORT /'
