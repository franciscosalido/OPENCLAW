# PostgreSQL relational memory
# Version is PINNED by ADR-0021 - never change postgres:18.4-trixie to latest
services:
  postgres:
    image: postgres:18.4-trixie
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
      - ../infra/postgres/secrets/postgres_password.txt:/run/secrets/quimera_postgres_password:ro
    environment:
      - POSTGRES_DB=quimera
      - POSTGRES_USER=quimera
      - POSTGRES_PASSWORD_FILE=/run/secrets/quimera_postgres_password
      - PGDATA=/var/lib/postgresql/18/docker
    command:
      - postgres
      - -c
      - shared_preload_libraries=pg_stat_statements
      - -c
      - compute_query_id=auto
      - -c
      - pg_stat_statements.max=10000
      - -c
      - pg_stat_statements.track=all
      - -c
      - track_io_timing=on
    restart: unless-stopped
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U quimera -d quimera -h 127.0.0.1
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

volumes:
  postgres_data:
