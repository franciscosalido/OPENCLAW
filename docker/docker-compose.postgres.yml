# PostgreSQL relational memory
# Base version is PINNED by ADR-0021 - never change postgres:18.4-trixie to latest.
# Runtime image is a local derivative with TimescaleDB + pgvector extensions.
services:
  postgres:
    image: quimera/postgres-memory:18.4-trixie-timescaledb-pgvector
    build:
      context: ..
      dockerfile: infra/postgres/Dockerfile
      args:
        POSTGRES_BASE_IMAGE: postgres:18.4-trixie
        PG_MAJOR: "18"
        TIMESCALEDB_VERSION: "2.23.0"
        PGVECTOR_VERSION: "0.8.2"
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
      - ../infra/postgres/initdb:/docker-entrypoint-initdb.d:ro
      - ../infra/postgres/secrets/postgres_password.txt:/run/secrets/quimera_postgres_password:ro
    environment:
      - POSTGRES_DB=quimera
      - POSTGRES_USER=quimera
      - POSTGRES_PASSWORD_FILE=/run/secrets/quimera_postgres_password
      - PGDATA=/var/lib/postgresql/18/docker
    command:
      - postgres
      - -c
      - shared_preload_libraries=timescaledb,pg_stat_statements
      - -c
      - compute_query_id=auto
      - -c
      - pg_stat_statements.max=10000
      - -c
      - pg_stat_statements.track=all
      - -c
      - track_io_timing=on
    restart: unless-stopped
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U quimera -d quimera -h 127.0.0.1
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

volumes:
  postgres_data:
