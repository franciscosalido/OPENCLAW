# Qdrant vector database
# Version is PINNED - never change :v1.18.0 to :latest
services:
  qdrant:
    image: qdrant/qdrant:v1.18.0
    ports:
      - "6333:6333"  # REST + Dashboard -> http://localhost:6333/dashboard
      - "6334:6334"  # gRPC
    volumes:
      - qdrant_data:/qdrant/storage
      - ../infra/qdrant/config.yaml:/qdrant/config/production.yaml:ro
    environment:
      - QDRANT__SERVICE__HTTP_PORT=6333
      - QDRANT__SERVICE__GRPC_PORT=6334
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:6333/healthz || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

volumes:
  qdrant_data:
