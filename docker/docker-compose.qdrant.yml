# Qdrant vector database
# Version is PINNED - never change :v1.18.2 to :latest
services:
  qdrant:
    # Server follows infra/qdrant/version_contract.yaml
    image: qdrant/qdrant:v1.18.2
    ports:
      - "6333:6333"  # REST + Dashboard -> http://localhost:6333/dashboard
      - "6334:6334"  # gRPC
    volumes:
      - qdrant_data:/qdrant/storage
      - ../infra/qdrant/config.yaml:/qdrant/config/production.yaml:ro
    environment:
      - QDRANT__SERVICE__HTTP_PORT=6333
      - QDRANT__SERVICE__GRPC_PORT=6334
    restart: unless-stopped
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          bash -lc 'exec 3<>/dev/tcp/127.0.0.1/6333 &&
          printf "GET /healthz HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n" >&3 &&
          grep -q "200" <&3'
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

volumes:
  qdrant_data:
